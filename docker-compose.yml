services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintenance-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db/scripts/:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - ./db/scripts/:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        database_exists=$$(/opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID(N'maintenance') IS NULL THEN 0 ELSE 1 END")
        if [ "$${database_exists}" -eq 0 ]; then
          /opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "CREATE DATABASE [maintenance]"
          /opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -d maintenance -i /scripts/schema.sql
          /opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -d maintenance -i /scripts/seed_large.sql
        fi

  api:
    # Dev: run the SDK image directly and let `dotnet watch` rebuild on change.
    # MaintenanceApi/Dockerfile is still the production build path.
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./MaintenanceApi:/src
      # Mask the host's bin/obj: they hold host-absolute paths and a host RID.
      - api-bin:/src/bin
      - api-obj:/src/obj
      # Persist the NuGet cache so restore doesn't re-download on every start.
      - nuget-packages:/root/.nuget/packages
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      # Bind-mount inotify events are unreliable; poll instead.
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # No TTY here, so auto-restart on rude edits instead of prompting.
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__Default: "Server=db,1433;Database=maintenance;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--project", "MaintenanceApi.csproj"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./maintenance_request:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - api

volumes:
  mssql-data:
  frontend-node-modules:
  api-bin:
  api-obj:
  nuget-packages:
