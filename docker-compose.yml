services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintenance-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - ./db:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        database_exists=$$(/opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID(N'maintenance') IS NULL THEN 0 ELSE 1 END")
        if [ "$${database_exists}" -eq 0 ]; then
          /opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "CREATE DATABASE [maintenance]"
          /opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d maintenance -i /scripts/schema.sql
          /opt/mssql-tools/bin/sqlcmd -S db,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d maintenance -i /scripts/seed_small.sql
        fi

  api:
    build: ./MaintenanceApi
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=maintenance;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./maintenance_request:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - api

volumes:
  mssql-data:
  frontend-node-modules:
